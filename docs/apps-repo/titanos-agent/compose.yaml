# TitanOS-Agent: Chat mit einem lokalen Ollama-Modell über den Zustand
# dieses NAS. Vorlage für ra5on/TitanOS-Apps (Ordner titanos-agent/);
# Quelltext und Image-Bau liegen in ra5on/TitanOS unter examples/agent.

x-titanos:
  name: TitanOS-Agent
  main: agent
  category: productivity

  description:
    de: >-
      Frag dein NAS im Chat: Ein lokales Modell aus Ollama liest über die
      MCP-Werkzeuge von TitanOS Volumes, Platten, Container, VMs, Backups
      und Protokolle und erklärt, was los ist. Der Agent ändert nichts.
    en: >-
      Ask your NAS in a chat: a local model from Ollama reads volumes,
      disks, containers, VMs, backups and logs through the MCP tools of
      TitanOS and explains what is going on. The agent changes nothing.

  tips:
    de: >-
      Vorher in TitanOS: unter Einstellungen › Zugang „API-Schlüssel und
      Agenten erlauben“ einschalten und unter Mein Konto einen Schlüssel
      erstellen (als Netz „Docker auf diesem NAS“ wählen). Den Fingerabdruck
      des Zertifikats findest du unter Einstellungen › Zugang. Ollama muss
      laufen und ein Modell mit Werkzeug-Unterstützung haben, zum Beispiel
      qwen3:8b oder llama3.1:8b (ollama pull qwen3:8b). Die Chat-Seite fragt
      nach dem Passwort aus AGENT_PASSWORD; der Benutzername ist beliebig.
    en: >-
      First, in TitanOS: switch on “Allow API keys and agents” under
      Settings › Access and make a key under My account (choose the network
      “Docker on this NAS”). The fingerprint of the certificate is under
      Settings › Access. Ollama must be running with a model that can call
      tools, such as qwen3:8b or llama3.1:8b (ollama pull qwen3:8b). The
      chat page asks for the password in AGENT_PASSWORD; any user name works.

  variables:
    TITANOS_API_KEY:
      label: { de: API-Schlüssel, en: API key }
      help:
        de: Aus Mein Konto › API-Schlüssel für Agenten, beginnt mit titanos_ak_.
        en: From My account › API keys for agents, starts with titanos_ak_.
      placeholder: titanos_ak_…
      required: true
    TITANOS_FINGERPRINT:
      label: { de: Fingerabdruck des Zertifikats, en: Certificate fingerprint }
      help:
        de: Einstellungen › Zugang › Zertifikat › Fingerabdruck (SHA-256). Mit Doppelpunkten oder ohne.
        en: Settings › Access › Certificate › Fingerprint (SHA-256). With or without colons.
      placeholder: "AB:CD:…"
      required: true
    TITANOS_URL:
      label: { de: Adresse des NAS, en: Address of the NAS }
      help:
        de: Ab Werk das NAS selbst, gesehen aus dem Container.
        en: By default the NAS itself, as seen from the container.
    OLLAMA_URL:
      label: { de: Adresse von Ollama, en: Ollama address }
      help:
        de: Ab Werk die Ollama-App auf diesem NAS (Port 11434).
        en: By default the Ollama app on this NAS (port 11434).
    OLLAMA_MODEL:
      label: { de: Modell, en: Model }
      help:
        de: Muss Werkzeuge aufrufen können. Im Chat lässt sich ein anderes wählen.
        en: Must be able to call tools. The chat can pick another one.
    AGENT_PASSWORD:
      label: { de: Passwort der Chat-Seite, en: Password of the chat page }
      secret: generate

  ports:
    "8080":
      label: Chat
      webui: true

services:
  agent:
    image: ghcr.io/ra5on/titanos-agent:latest
    restart: unless-stopped
    environment:
      TITANOS_URL: "https://host.docker.internal"
      TITANOS_API_KEY: ""
      TITANOS_FINGERPRINT: ""
      OLLAMA_URL: "http://host.docker.internal:11434"
      OLLAMA_MODEL: "qwen3:8b"
      AGENT_PASSWORD: ""
    # The NAS and the Ollama app, from inside the container.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8765:8080"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
