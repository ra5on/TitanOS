<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="TitanOS">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#030712"/>
      <stop offset="1" stop-color="#0b1a33"/>
    </linearGradient>
    <linearGradient id="a1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2fd3a0" stop-opacity="0"/>
      <stop offset=".35" stop-color="#2fd3a0" stop-opacity=".75"/>
      <stop offset=".7" stop-color="#5aa9ff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#8b7bff" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="22"/></filter>
    <style>
      .c1{animation:drift 14s ease-in-out infinite alternate;transform-origin:600px 160px}
      .c2{animation:drift 18s ease-in-out infinite alternate-reverse;transform-origin:600px 190px}
      .stars circle{animation:tw 5s ease-in-out infinite}
      .stars circle:nth-child(3n){animation-delay:1.7s}.stars circle:nth-child(4n){animation-delay:3.1s}
      @keyframes drift{0%{transform:translateX(-40px) skewX(-6deg) scaleY(.9)}100%{transform:translateX(40px) skewX(6deg) scaleY(1.1)}}
      @keyframes tw{50%{opacity:.25}}
      @media (prefers-reduced-motion: reduce){*{animation:none!important}}
    </style>
  </defs>
  <rect width="1200" height="420" fill="url(#sky)"/>
  <g class="stars" fill="#fff" opacity=".8">
    <circle cx="80" cy="40" r="1.2"/><circle cx="210" cy="90" r=".9"/><circle cx="330" cy="30" r="1.1"/><circle cx="470" cy="70" r=".8"/>
    <circle cx="640" cy="25" r="1.2"/><circle cx="780" cy="60" r=".9"/><circle cx="900" cy="35" r="1.3"/><circle cx="1040" cy="80" r="1"/>
    <circle cx="1150" cy="30" r=".9"/><circle cx="150" cy="150" r=".7"/><circle cx="1110" cy="160" r=".8"/><circle cx="560" cy="110" r=".7"/>
  </g>
  <g filter="url(#blur)">
    <path class="c1" d="M-50 220 C 200 90, 420 250, 650 140 S 1050 90, 1260 170 L1260 230 C 1040 160, 840 230, 640 210 S 200 180, -50 280Z" fill="url(#a1)"/>
    <path class="c2" d="M-50 260 C 260 160, 500 300, 760 200 S 1080 170, 1260 240 L1260 280 C 1000 230, 800 280, 600 260 S 220 230, -50 320Z" fill="url(#a1)" opacity=".7"/>
  </g>
  <path d="M0 330 L120 300 L210 320 L330 270 L430 310 L560 280 L700 320 L820 285 L940 315 L1060 290 L1200 320 L1200 420 L0 420Z" fill="#050a14"/>
  <path d="M0 360 C 300 350, 900 350, 1200 360 L1200 420 L0 420Z" fill="#071226" opacity=".9"/>
  <g transform="translate(600 210)" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" fill="#fff">
    <text y="-6" font-size="58" font-weight="800" letter-spacing="10">TITAN<tspan fill="#6CB6FF">OS</tspan></text>
    <text y="40" font-size="20" fill="#cfe3ff" opacity=".9">Deine Daten. Deine Apps. Dein Server.</text>
  </g>
</svg>
