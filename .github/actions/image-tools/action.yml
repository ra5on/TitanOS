name: Tools for building the image
description: Node, Go, mkosi and the packages that release.yml and ra5on/TitanOS-Plugins build and boot the image with.

runs:
  using: composite
  steps:
    # Exact toolchain versions come from the lock file the dev setup uses.
    - name: Read pinned toolchain versions
      id: lock
      shell: bash
      run: |
        lock="$GITHUB_WORKSPACE/scripts/dev-toolchains.lock.json"
        echo "node=$(jq -er .node.version "$lock")" >> "$GITHUB_OUTPUT"
        echo "go=$(jq -er .go.version "$lock")" >> "$GITHUB_OUTPUT"
        echo "mkosi-source=$(jq -er .mkosi.source "$lock")" >> "$GITHUB_OUTPUT"
        echo "mkosi-commit=$(jq -er .mkosi.commit "$lock")" >> "$GITHUB_OUTPUT"

    - uses: actions/setup-node@v7
      with:
        node-version: ${{ steps.lock.outputs.node }}
        cache: npm
        cache-dependency-path: web/package-lock.json

    - uses: actions/setup-go@v7
      with:
        go-version: ${{ steps.lock.outputs.go }}
        cache-dependency-path: backend/go.sum

    - name: Packages and mkosi
      shell: bash
      env:
        MKOSI_SOURCE: ${{ steps.lock.outputs.mkosi-source }}
        MKOSI_COMMIT: ${{ steps.lock.outputs.mkosi-commit }}
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends debian-archive-keyring squashfs-tools zstd zip systemd-container python3-venv minisign qemu-system-x86 qemu-utils ovmf mtools exfatprogs fdisk kmod openssh-client smbclient gcc libc6-dev restic
        # The exact commit the image is developed with (dev-toolchains.lock.json).
        python3 -m venv "$RUNNER_TEMP/mkosi"
        "$RUNNER_TEMP/mkosi/bin/pip" install "git+$MKOSI_SOURCE@$MKOSI_COMMIT"
        echo "$RUNNER_TEMP/mkosi/bin" >> "$GITHUB_PATH"
