name: Agent

# The example agent in examples/agent: unit tests, the image, and a short
# start of the container. Only main publishes ghcr.io/ra5on/titanos-agent;
# pull requests build and test without pushing.

on:
  pull_request:
    paths:
      - 'examples/agent/**'
      - '.github/workflows/agent.yml'
  push:
    branches: [main]
    paths:
      - 'examples/agent/**'
      - '.github/workflows/agent.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agent:
    name: Agent image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Unit tests
        working-directory: examples/agent
        run: python3 -m unittest -v test_agent.py

      - name: Build image
        run: docker build --pull -t titanos-agent examples/agent

      - name: Start the container
        run: |
          docker run -d --name agent --read-only --cap-drop ALL --security-opt no-new-privileges:true \
            -p 8080:8080 -e AGENT_PASSWORD=test titanos-agent
          for i in $(seq 30); do curl -fs localhost:8080/healthz && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/)" = 401
          curl -fs -u x:test localhost:8080/ | grep -q 'TitanOS'
          # Without a key the status names what is missing instead of failing.
          curl -fs -u x:test localhost:8080/api/status | grep -q 'TITANOS_API_KEY'
          test "$(docker inspect -f '{{.State.Health.Status}}' agent)" != unhealthy
          docker logs agent

      - name: Publish
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          for tag in latest "sha-${GITHUB_SHA::12}"; do
            docker tag titanos-agent "ghcr.io/ra5on/titanos-agent:$tag"
            docker push "ghcr.io/ra5on/titanos-agent:$tag"
          done
