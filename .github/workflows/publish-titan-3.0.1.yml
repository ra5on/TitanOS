name: Publish verified Titan 3.0.1

on:
  workflow_dispatch:
  push:
    branches: [titan-publish-3.0.1]
    paths:
      - '.github/workflows/publish-titan-3.0.1.yml'
      - 'scripts/promote-titan-3.0.1.py'

permissions:
  contents: write
  actions: read

concurrency:
  group: titan-publish-3.0.1
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'ra5on/TitanOS'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify exact signed candidate and publish existing assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/promote-titan-3.0.1.py
