name: NVIDIA driver updates

# Only driver assets are appended to an existing release. Its OS manifest,
# slots and original plugins are never changed. Signing still needs approval.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing TitanOS version (without v); empty = latest beta and stable'
        default: ''
      driver:
        description: 'NVIDIA version from the signed Debian archive, or latest'
        default: latest
      force:
        description: 'Rebuild even when upstream packages have not changed'
        type: boolean
        default: false

concurrency:
  group: nvidia-driver-updates
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
jobs:
  dispatch:
    # The signing environment permits v* tags only. A scheduled/default-branch
    # run delegates to published, reviewed code instead of widening that rule.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    steps:
      - name: Run the driver workflow from a published release tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          DRIVER: ${{ inputs.driver || 'latest' }}
          FORCE: ${{ inputs.force || 'false' }}
        run: |
          execution_tag=
          while IFS= read -r tag; do
            if gh api "repos/$GITHUB_REPOSITORY/contents/.github/workflows/nvidia-driver.yml?ref=$tag" >/dev/null 2>&1; then
              execution_tag=$tag
              break
            fi
          done < <(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.draft == false and (.tag_name | test("^v[0-9]+\\.[0-9]+\\.[0-9]+(-[a-z0-9.]+)?$"))) | .tag_name')
          if [ -z "$execution_tag" ]; then
            echo "No published release contains the driver workflow yet."
            exit 0
          fi
          gh workflow run nvidia-driver.yml --repo "$GITHUB_REPOSITORY" --ref "$execution_tag" \
            -f version="$VERSION" -f driver="$DRIVER" -f force="$FORCE"
          echo "Driver check dispatched from $execution_tag; signing still requires release approval."
  targets:
    if: github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    outputs:
      versions: ${{ steps.targets.outputs.versions }}
    steps:
      - name: Select existing OS releases
        id: targets
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REQUESTED: ${{ inputs.version }}
        run: |
          if [ -n "$REQUESTED" ]; then
            [[ "$REQUESTED" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[a-z0-9.]+)?$ ]]
            versions=$(jq -cn --arg v "$REQUESTED" '[$v]')
          else
            versions=$(gh api "repos/$REPOSITORY/releases" --jq '[.[] | select(.draft == false and (.tag_name | test("^v[0-9]+\\.[0-9]+\\.[0-9]+")))] | group_by(.prerelease) | map(.[0].tag_name | ltrimstr("v"))')
          fi
          echo "versions=$versions" >> "$GITHUB_OUTPUT"
  build:
    needs: targets
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.targets.outputs.versions) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends debian-archive-keyring gnupg gpgv minisign squashfs-tools systemd-container python3-venv kmod
          # The exact mkosi commit the image is developed with.
          lock=scripts/dev-toolchains.lock.json
          python3 -m venv "$RUNNER_TEMP/mkosi"
          "$RUNNER_TEMP/mkosi/bin/pip" install "git+$(jq -er .mkosi.source "$lock")@$(jq -er .mkosi.commit "$lock")"
          echo "$RUNNER_TEMP/mkosi/bin" >> "$GITHUB_PATH"
      - name: Authenticate upstream packages and target OS
        id: check
        env:
          DRIVER: ${{ inputs.driver || 'latest' }}
          VERSION: ${{ matrix.version }}
          FORCE: ${{ inputs.force }}
        run: |
          python3 scripts/update-nvidia-lock.py --driver "$DRIVER" --output out/nvidia-lock.json
          force=
          if [ "$FORCE" = true ] || [ "$DRIVER" != latest ]; then force=--force; fi
          python3 scripts/nvidia-update-release.py prepare "$VERSION" out/nvidia-lock.json out/nvidia-target.json $force
          echo "needed=$(jq -r .needed out/nvidia-target.json)" >> "$GITHUB_OUTPUT"
      - name: Build matching open kernel modules and plugin
        if: steps.check.outputs.needed == 'true'
        env:
          VERSION: ${{ matrix.version }}
        run: |
          cp out/nvidia-lock.json plugins/nvidia/packages.lock.json
          kernel=$(jq -r .kernel out/nvidia-target.json)
          sudo env PATH="$PATH" NVIDIA_KERNEL="$kernel" NVIDIA_REVISION="$GITHUB_RUN_NUMBER" scripts/make-nvidia-plugin.sh "$VERSION"
          sudo chown -R "$(id -u):$(id -g)" out
          python3 scripts/nvidia-update-release.py pack out/nvidia-target.json out/plugins out/driver-release
      - name: Validate image metadata and module compatibility
        if: steps.check.outputs.needed == 'true'
        run: |
          python3 scripts/test-nvidia-update-image.py out/driver-release
      - uses: actions/upload-artifact@v7
        if: steps.check.outputs.needed == 'true'
        with:
          name: driver-${{ matrix.version }}
          path: out/driver-release/
          if-no-files-found: error
  changed:
    needs: build
    # One failed matrix leg (fail-fast is off) must not hold back the drivers
    # that built and validated. Only legs whose build job succeeded and that
    # uploaded an artifact are published; a failed leg never is.
    if: ${{ !cancelled() && needs.build.result != 'skipped' }}
    runs-on: ubuntu-24.04
    outputs:
      versions: ${{ steps.changed.outputs.versions }}
    steps:
      - name: List actual driver builds of successful legs
        id: changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          artifacts=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" --jq '.artifacts[] | select(.expired == false) | .name | select(startswith("driver-")) | ltrimstr("driver-")' | jq -Rsc 'split("\n") | map(select(length > 0))')
          succeeded=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?filter=latest&per_page=100" --jq '.jobs[] | select(.conclusion == "success") | .name | select(startswith("build (")) | ltrimstr("build (") | rtrimstr(")")' | jq -Rsc 'split("\n") | map(select(length > 0))')
          versions=$(jq -cn --argjson a "$artifacts" --argjson s "$succeeded" '[$a[] | select(. as $v | $s | index($v))] | unique')
          echo "Artifacts: $artifacts; successful build legs: $succeeded; publishing: $versions"
          echo "versions=$versions" >> "$GITHUB_OUTPUT"
  publish:
    needs: changed
    if: ${{ !cancelled() && needs.changed.result == 'success' && needs.changed.outputs.versions != '[]' }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        version: ${{ fromJSON(needs.changed.outputs.versions) }}
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - name: Check for a changed driver artifact
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ matrix.version }}
        run: |
          exists=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" --jq ".artifacts | any(.name == \"driver-$VERSION\")")
          echo "exists=$exists" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v7
        if: steps.artifact.outputs.exists == 'true'
        with:
          name: driver-${{ matrix.version }}
          path: driver-release
      - name: Sign the driver and updated version menu
        if: steps.artifact.outputs.exists == 'true'
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends minisign
          python3 scripts/check-release-keys.py build/mkosi.extra/usr/share/titanos/update-keys
          key=$(mktemp)
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key"
          python3 scripts/nvidia-update-release.py sign driver-release "$key"
          python3 scripts/nvidia-update-release.py verify driver-release
      - name: Append immutable driver assets, then update only the signed menu
        if: steps.artifact.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ matrix.version }}
        run: |
          gh release upload "v$VERSION" driver-release/nvidia-update-*
          gh release upload "v$VERSION" driver-release/nvidia-updates.json driver-release/nvidia-updates.json.minisig --clobber
