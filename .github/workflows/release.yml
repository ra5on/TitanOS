name: Release

# Builds the image for a tag like v1.2.0 or v1.2.0-beta.1 and publishes it
# as a release, with the manifest that NAS boxes update from. The manifest
# is signed in a second job that needs an approval and alone sees the key.
# See docs/RELEASING.md.
#
# Pull requests rehearse only the image and its boot here. The plugins are
# built, tested and signed in ra5on/TitanOS-Plugins (docs/PLUGIN-REPO.md); a
# tag asks it for the set of a new kernel, waits for it and carries the sets
# in the release for NAS that do not know the plugin repository yet.
#
# A tag on which only titand changed since the last full release becomes an
# app release (scripts/release-kind.py, docs/APP-UPDATES.md): the published
# image of that release gets the new titand, without mkosi and new plugins.

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'build/**'
      - 'boot/**'
      - 'scripts/make-zip.sh'
      - 'scripts/make-grub.sh'
      - 'scripts/stick-bios.py'
      - 'scripts/make-stick-image.py'
      - 'scripts/grubenv.py'
      - 'scripts/check-image-hardware.py'
      - 'plugins/catalog/**'
      - 'scripts/plugin-set.py'
      - 'scripts/normalize-image-tmpfiles.py'
      - 'scripts/make-release.sh'
      - 'scripts/sign-release.sh'
      - 'scripts/verify-release.py'
      - 'scripts/check-release-keys.py'
      - 'scripts/third-party-licenses.py'
      - 'scripts/licenses/**'
      - 'scripts/smoke-release.py'
      - 'scripts/smoke-app-update.py'
      - 'scripts/repack-release.py'
      - 'scripts/release-kind.py'
      - 'scripts/smoke-storage.py'
      - 'scripts/smoke-cache.py'
      - 'backend/internal/storage/cache.go'
      - 'scripts/workflows023_smoke.py'
      - 'scripts/files_usb_smoke.py'
      - 'scripts/smb_backup_smoke.py'
      - 'scripts/network_smoke.py'
      - 'scripts/vm_snapshot_smoke.py'
      - 'scripts/quota_smoke.py'
      - 'backend/internal/quota/**'
      - 'backend/internal/storage/quota.go'
      - 'backend/internal/shares/quota.go'
      - 'scripts/snapshot-guest.c'
      - 'docs/releases/**'
      - '.github/actions/image-tools/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version for a build/sign/boot rehearsal (never publishes)'
        required: true
        default: '0.2.0-beta.4'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Release image
    runs-on: ubuntu-24.04
    # A tag may wait for the plugin set of a new kernel (built and approved
    # in the plugin repository).
    timeout-minutes: ${{ github.event_name == 'push' && 360 || 90 }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      channel: ${{ steps.version.outputs.channel }}
      kind: ${{ steps.kind.outputs.kind }}
      base: ${{ steps.kind.outputs.base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The message of the tag is the changelog.
          fetch-depth: 0

      - name: Version and channel
        id: version
        env:
          REHEARSAL_VERSION: ${{ inputs.version || '0.2.0-beta.4' }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            version=${GITHUB_REF_NAME#v}
            git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > changelog.txt
          else
            version=$REHEARSAL_VERSION
            printf '%s\n' 'Release rehearsal. Disposable signing key. Not for distribution.' > changelog.txt
          fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[a-z0-9.]+)?$'; then
            echo "the tag must look like v1.2.3 or v1.2.3-beta.1" >&2
            exit 1
          fi
          case "$version" in *-*) channel=beta ;; *) channel=stable ;; esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: App release or full release
        id: kind
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            python3 scripts/release-kind.py "$VERSION" --tag-message changelog.txt >> "$GITHUB_OUTPUT"
          else
            # Rehearsals build the full image and try app updates on it in QEMU.
            printf 'kind=system\nbase=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"
          fi

      - uses: ./.github/actions/image-tools

      - name: Signing keys for the image
        run: |
          keys=build/mkosi.extra/usr/share/titanos/update-keys
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            python3 scripts/check-release-keys.py "$keys"
          else
            # No production secrets are available in this job, including on PRs.
            minisign -G -W -p "$keys/rehearsal.pub" -s "$RUNNER_TEMP/rehearsal.key"
          fi

      - name: Test
        run: make test test-release

      - name: Build titand with the web UI
        run: make build VERSION=${{ steps.version.outputs.version }}

      - name: Build the image
        if: steps.kind.outputs.kind == 'system'
        # As root mkosi needs no user namespace, which the runner restricts.
        run: |
          # Generate app notices as the build user: Go's module cache is there.
          # The prepared tree is passed to the privileged mkosi invocation.
          VERSION=${{ steps.version.outputs.version }} MKOSI_SUDO=1 scripts/make-zip.sh
          sudo chown -R "$(id -u):$(id -g)" out build/mkosi.output

      - name: Build the image with the newer kernel (kernel choice "Neu")
        if: steps.kind.outputs.kind == 'system'
        # The same system with the kernel of trixie-backports (docs/KERNEL.md),
        # into build/mkosi.output-new and out/kernel-new; make-release.sh
        # carries it as the slot variant "new".
        run: |
          VERSION=${{ steps.version.outputs.version }} MKOSI_SUDO=1 scripts/make-zip.sh --kernel-new
          sudo chown -R "$(id -u):$(id -g)" out build/mkosi.output-new

      - name: The image of the base release with the new titand
        if: steps.kind.outputs.kind == 'app'
        run: python3 scripts/repack-release.py --base ${{ steps.kind.outputs.base }} --version ${{ steps.version.outputs.version }}

      - name: Plugin sets for the kernel of this image
        id: plugins
        if: github.event_name != 'pull_request' && steps.kind.outputs.kind == 'system'
        timeout-minutes: 300
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ secrets.PLUGINS_DISPATCH_TOKEN }}
        run: |
          # Both kernels need their plugin set: the default one is carried in
          # the release, the one of the newer kernel is fetched by the NAS
          # from the plugin repository (doubled plugin build time, decided
          # 31.10.2026). variant is "" or "new".
          sets() {
            image=$1; dest=$2; variant=$3
            kernel=$(cat "$image/kernel-version")
            package=$(python3 scripts/plugin-set.py package "$image")
            fetch() { python3 scripts/plugin-set.py fetch --base "$VERSION" --kernel "$kernel" --kernel-package "$package" --dest "$dest"; }
            status=0; fetch || status=$?
            if [ "$status" = 3 ] && [ "$GITHUB_EVENT_NAME" = push ]; then
              if [ -z "$GH_TOKEN" ]; then
                echo "no plugin set for $kernel ($package) and no PLUGINS_DISPATCH_TOKEN to request one" >&2
                exit 1
              fi
              # The plugin repository rebuilds this commit's image (with the
              # newer kernel for the variant), checks the kernel, builds and
              # tests the set; its owner approves the signing.
              gh api repos/ra5on/TitanOS-Plugins/dispatches -f event_type=titanos-release \
                -f "client_payload[version]=$VERSION" -f "client_payload[ref]=$GITHUB_SHA" \
                -f "client_payload[kernel]=$kernel" -f "client_payload[kernelPackage]=$package" \
                -f "client_payload[kernelVariant]=$variant"
              echo "Waiting for the plugin set of $kernel ($package)"
              until [ "$status" = 0 ]; do
                sleep 120
                status=0; fetch || status=$?
                [ "$status" = 0 ] || [ "$status" = 3 ] || exit "$status"
              done
            fi
            return "$status"
          }
          status=0; sets build/mkosi.output out/plugin-sets "" || status=$?
          if [ "$status" = 3 ]; then
            # A manual rehearsal of a kernel without a set packs the system alone.
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          elif [ "$status" != 0 ]; then
            exit "$status"
          fi
          python3 scripts/plugin-set.py import --base "$VERSION" out/plugin-sets/kernel out/plugin-sets/common
          status=0; sets build/mkosi.output-new out/plugin-sets-new new || status=$?
          if [ "$status" = 3 ]; then
            echo "::warning::no plugin set for the newer kernel yet; NAS with kernel choice 'Neu' and kernel plugins cannot update until it exists"
          elif [ "$status" != 0 ]; then
            exit "$status"
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Test NVIDIA compilation in the NAS build environment
        if: steps.plugins.outputs.ready == 'true'
        run: |
          sdk="$PWD/out/plugins/nvidia-build-sdk.tar.zst"
          cd backend
          sudo env PATH="$PATH" TITANOS_TEST_NVIDIA_SDK="$sdk" go test ./internal/plugins -run '^TestRealNASBuildEnvironment$' -count=1 -timeout 25m -v

      - name: Pack the release
        env:
          # Only a pull request packs the system alone; it is never published.
          WITHOUT_PLUGINS: ${{ (github.event_name == 'pull_request' || steps.plugins.outputs.ready == 'false') && '1' || '' }}
          BASE_VERSION: ${{ steps.kind.outputs.base }}
          # The stick as a disk image for boards with a legacy BIOS.
          STICK_IMAGE: '1'
        run: scripts/make-release.sh ${{ steps.version.outputs.version }} ${{ steps.version.outputs.channel }} changelog.txt

      - name: Exercise signing and verification with a disposable key
        if: github.event_name != 'push'
        run: |
          scripts/sign-release.sh out/release "$RUNNER_TEMP/rehearsal.key"
          python3 scripts/verify-release.py ${{ (github.event_name == 'pull_request' || steps.plugins.outputs.ready == 'false') && '--without-plugins' || '' }} out/release build/mkosi.extra/usr/share/titanos/update-keys

      - name: Boot the actual installation ZIP in UEFI QEMU
        run: python3 scripts/smoke-release.py out/release/titanos-${{ steps.version.outputs.version }}.zip ${{ (github.event_name != 'pull_request' && steps.plugins.outputs.ready != 'false') && '--plugins out/release' || '' }} --timeout 420

      - name: Boot the image with the newer kernel, and the stick with a legacy BIOS and 32-bit UEFI
        # An app release on a base from before 0.41 has neither.
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          zip=out/release/titanos-$VERSION.zip
          if [ -f "out/release/titanos-$VERSION-new-vmlinuz" ]; then
            python3 scripts/smoke-release.py "$zip" --kernel-new out/release --log out/release-smoke-kernel-new.log --timeout 420
          fi
          if unzip -l "$zip" boot/grub/grub.cfg > /dev/null; then
            python3 scripts/smoke-release.py "$zip" --firmware bios --log out/release-smoke-bios.log --timeout 420
            python3 scripts/smoke-release.py "$zip" --firmware ia32 --log out/release-smoke-ia32.log --timeout 420
          fi

      - name: App update, its failure and the way back in UEFI QEMU
        if: github.event_name != 'push'
        run: |
          python3 scripts/smoke-app-update.py out/release/titanos-${{ steps.version.outputs.version }}.zip --release out/release --key "$RUNNER_TEMP/rehearsal.key" --timeout 420
          rm "$RUNNER_TEMP/rehearsal.key"

      - name: VM RAM snapshots, Btrfs recovery, replacement and optional tools
        # An app release keeps image and plugins of its base, which were tested then.
        if: steps.kind.outputs.kind == 'system'
        run: python3 scripts/smoke-storage.py out/release/titanos-${{ steps.version.outputs.version }}.zip ${{ (github.event_name != 'pull_request' && steps.plugins.outputs.ready != 'false') && '--plugins out/release' || '' }} --timeout 420 --workflows023

      - name: SSD cache with real dm-cache (writeback, switch-off, missing SSD, delete)
        # Also for app releases: the cache logic is titand's own code, which an
        # app release changes (scripts/smoke-cache.py, docs/SSD-CACHE.md).
        timeout-minutes: 40
        run: python3 scripts/smoke-cache.py out/release/titanos-${{ steps.version.outputs.version }}.zip --output out/validation/cache --timeout 420

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: release-boot-log
          path: |
            out/release-smoke*.log
            out/app-update-smoke*.log
            out/storage-smoke*.log
            out/network-smoke*.log
            out/validation/cache/cache-result.json
            out/validation/cache/cache-serial.log
            out/validation/cache/cache-titand-boot*.log
          if-no-files-found: ignore
          retention-days: 7

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ github.event_name == 'push' && 'release' || 'release-rehearsal' }}
          path: out/release/
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The environment asks for an approval and holds the signing key.
    environment: release
    permissions:
      contents: write
    steps:
      # Only for the public keys and the release notes; nothing is built here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release
          path: release

      - name: Sign manifest, installation ZIP and checksums
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends minisign
          if [ -z "$MINISIGN_SECRET_KEY" ]; then
            echo "the environment 'release' holds no MINISIGN_SECRET_KEY" >&2
            exit 1
          fi
          key=$(mktemp)
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key"
          scripts/sign-release.sh release "$key"

      - name: The signature must be one that the image accepts
        run: python3 scripts/verify-release.py release build/mkosi.extra/usr/share/titanos/update-keys

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          CHANNEL: ${{ needs.build.outputs.channel }}
        run: |
          apache=$(date -u -d '+2 years' +%Y-%m-%d)
          base=$(python3 -c 'import json; print(json.load(open("release/manifest.json"))["app"]["base"])')
          {
            python3 -c 'import json; print(json.load(open("release/manifest.json"))["changelog"])'
            echo
            if [ "$base" != "$VERSION" ]; then
              echo "**App update:** NAS running TitanOS $base or a later app update on it install \`titanos-$VERSION-titand\` alone, without restarting the NAS. Older systems install the full image as before."
              echo
            fi
            echo "---"
            echo
            echo "**Installing:** verify \`titanos-$VERSION.zip.minisig\`, then unpack \`titanos-$VERSION.zip\` onto a FAT32 stick named \`TITANOS\`. See the README for prerequisites. From 0.5.0 onward, Settings › Updates follows the single Stable channel; optional Beta features are marked in the interface."
            echo
            echo "**License:** Fair Source (FSL-1.1-ALv2). This version is available under Apache-2.0 from $apache."
            echo
            echo "**Third-party components:** \`titanos-$VERSION-sources.txt\` links the exact packages; \`titanos-$VERSION-licenses.tar.gz\` contains the original notices and version inventory. This includes Debian, firmware, Go, frontend libraries and fonts."
          } > notes.md
          prerelease=
          if [ "$CHANNEL" = beta ]; then prerelease=--prerelease; fi
          gh release create "$GITHUB_REF_NAME" release/* \
            --title "TitanOS $VERSION" --notes-file notes.md --verify-tag $prerelease
