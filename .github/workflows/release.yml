name: Release

# Builds the image for a tag like v1.2.0 or v1.2.0-beta.1 and publishes it
# as a release, with the manifest that NAS boxes update from. The manifest
# is signed in a second job that needs an approval and alone sees the key.
# See docs/RELEASING.md.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      channel: ${{ steps.version.outputs.channel }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The message of the tag is the changelog.
          fetch-depth: 0

      - name: Version and channel from the tag
        id: version
        run: |
          version=${GITHUB_REF_NAME#v}
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[a-z0-9.]+)?$'; then
            echo "the tag must look like v1.2.3 or v1.2.3-beta.1" >&2
            exit 1
          fi
          case "$version" in *-*) channel=beta ;; *) channel=stable ;; esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > changelog.txt

      - name: A release needs a key in the image
        run: |
          if ! ls build/mkosi.extra/usr/share/titanos/update-keys/*.pub > /dev/null 2>&1; then
            echo "no public key in build/mkosi.extra/usr/share/titanos/update-keys: this image could never be updated" >&2
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache-dependency-path: backend/go.sum

      - name: Tools for building the image
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends debian-archive-keyring squashfs-tools zstd zip systemd-container pipx
          # The version the image is developed with.
          sudo pipx install --global "git+https://github.com/systemd/mkosi.git@v25.3"

      - name: Test
        run: make test

      - name: Build titand with the web UI
        run: make build VERSION=${{ steps.version.outputs.version }}

      - name: Build the image
        # As root mkosi needs no user namespace, which the runner restricts.
        run: |
          sudo env "PATH=$PATH" VERSION=${{ steps.version.outputs.version }} scripts/make-zip.sh
          sudo chown -R "$(id -u):$(id -g)" out build/mkosi.output

      - name: Pack the release
        run: scripts/make-release.sh ${{ steps.version.outputs.version }} ${{ steps.version.outputs.channel }} changelog.txt

      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: out/release/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-24.04
    # The environment asks for an approval and holds the signing key.
    environment: release
    permissions:
      contents: write
    steps:
      # Only for the public keys and the release notes; nothing is built here.
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          name: release
          path: release

      - name: Sign the manifest
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends minisign
          if [ -z "$MINISIGN_SECRET_KEY" ]; then
            echo "the environment 'release' holds no MINISIGN_SECRET_KEY" >&2
            exit 1
          fi
          key=$(mktemp)
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key"
          printf '%s\n' "$MINISIGN_PASSWORD" | minisign -S -s "$key" -m release/manifest.json \
            -t "TitanOS ${{ needs.build.outputs.version }}"

      - name: The signature must be one that the image accepts
        run: |
          for key in build/mkosi.extra/usr/share/titanos/update-keys/*.pub; do
            if minisign -V -p "$key" -m release/manifest.json; then
              exit 0
            fi
          done
          echo "the manifest is not signed by a key that ships in the image" >&2
          exit 1

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          CHANNEL: ${{ needs.build.outputs.channel }}
        run: |
          apache=$(date -u -d '+2 years' +%Y-%m-%d)
          {
            python3 -c 'import json; print(json.load(open("release/manifest.json"))["changelog"])'
            echo
            echo "---"
            echo
            echo "**Installing:** unpack \`titanos-$VERSION.zip\` onto a FAT32 stick named \`TITANOS\`. A running TitanOS finds this release under Settings › Updates."
            echo
            echo "**License:** Fair Source (FSL-1.1-ALv2). This version is available under Apache-2.0 from $apache."
            echo
            echo "**Sources:** the image is built from Debian packages, many under the GPL. \`titanos-$VERSION-sources.txt\` links the exact source of each."
          } > notes.md
          prerelease=
          if [ "$CHANNEL" = beta ]; then prerelease=--prerelease; fi
          gh release create "$GITHUB_REF_NAME" release/* \
            --title "TitanOS $VERSION" --notes-file notes.md --verify-tag $prerelease
