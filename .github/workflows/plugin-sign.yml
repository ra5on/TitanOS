name: Plugin sets

# Signs and publishes what ra5on/TitanOS-Plugins built and tested: its plugin
# sets (draft releases common-<n> / kernel-<package>-<n>) and NVIDIA driver
# updates (draft releases pending-nvidia-<run>-<kernel set>). The key stays in
# this repository's environment "release"; the plugin repository never sees
# it, and none of its code runs next to it: the drafts are downloaded as data
# and signed by scripts/sign-plugin-set.py of this tag. See docs/PLUGIN-REPO.md.
#
# The environment permits v* tags only. A scheduled or manual run on the
# default branch therefore only looks for drafts and, if there are some,
# starts this workflow again from the newest v* tag that contains it, which
# then asks the owner for approval. A tag, not a published release: the full
# release that asks for its kernel set waits for exactly this signature
# before it can be published.
#
# With the repository variable AUTOPILOT_PLUGINS=on (off by default) two
# kinds of sets are signed without an approval, through the environment
# security-release (docs/AUTOPILOT.md):
# - the kernel and common sets of a security release of the autopilot, while
#   its tag waits for the release;
# - a common set of the nightly upstream run of the plugin repository that
#   differs from the published one only in newer Tailscale or NetBird
#   versions (scripts/plugin-guard.py, checked here and again next to the key).
# NVIDIA driver updates always keep the approval.
#
# With or without an approval, a set is signed only if every file of it
# carries the attestation of the plugin repository's release workflow on its
# main branch: nothing else ties a draft to a build.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      auto:
        description: 'Sign the kernel and common sets of an autopilot release without an approval'
        type: boolean
        default: false

concurrency:
  group: plugin-sign-${{ github.ref_type }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PLUGINS: ra5on/TitanOS-Plugins
  DRAFTS: '[.[] | select(.draft) | select(.tag_name | test("^((common|kernel-[0-9][0-9A-Za-z._~-]*)-[1-9][0-9]*|pending-nvidia-[0-9]+-kernel-[0-9][0-9A-Za-z._~-]*-[1-9][0-9]*)$")) | .tag_name] | unique'

jobs:
  dispatch:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    steps:
      - name: Drafts waiting to be signed
        id: drafts
        env:
          GH_TOKEN: ${{ secrets.PLUGINS_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "No PLUGINS_DISPATCH_TOKEN; nothing to look at."
            echo "tags=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tags=$(gh api "repos/$PLUGINS/releases?per_page=100" --jq "$DRAFTS")
          echo "Drafts: $tags"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.drafts.outputs.tags != '[]' && vars.AUTOPILOT_PLUGINS == 'on'
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Sets of an autopilot release, or a common set of newer upstream versions
        id: auto
        if: steps.drafts.outputs.tags != '[]' && vars.AUTOPILOT_PLUGINS == 'on'
        env:
          TAGS: ${{ steps.drafts.outputs.tags }}
          GH_TOKEN: ${{ secrets.PLUGINS_DISPATCH_TOKEN }}
        run: |
          pending=$(python3 scripts/autopilot.py pending | sed -n 's/^pending=//p')
          # Driver updates in the drafts keep the approval for all of them.
          if jq -e 'any(.[]; startswith("pending-nvidia-"))' <<<"$TAGS" >/dev/null; then
            echo "auto=false" >> "$GITHUB_OUTPUT"
          elif [ -n "$pending" ]; then
            echo "Kernel and common sets for $pending of the autopilot."
            echo "auto=true" >> "$GITHUB_OUTPUT"
            echo "tag=$pending" >> "$GITHUB_OUTPUT"
          elif [ "$(jq -r 'length' <<<"$TAGS")" = 1 ] && jq -e '.[0] | startswith("common-")' <<<"$TAGS" >/dev/null; then
            sudo apt-get install -y --no-install-recommends minisign >/dev/null
            if scripts/plugin-common-check.sh "$(jq -r '.[0]' <<<"$TAGS")"; then
              echo "auto=true" >> "$GITHUB_OUTPUT"
            else
              echo "auto=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "auto=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Sign them from the newest release tag
        if: steps.drafts.outputs.tags != '[]'
        env:
          GH_TOKEN: ${{ github.token }}
          AUTO: ${{ steps.auto.outputs.auto == 'true' }}
          PENDING: ${{ steps.auto.outputs.tag }}
        run: |
          execution_tag=
          while IFS= read -r tag; do
            # Older tags signed with scripts of the plugin repository; only
            # one with this repository's own signer may hold the key.
            if gh api "repos/$GITHUB_REPOSITORY/contents/scripts/sign-plugin-set.py?ref=$tag" >/dev/null 2>&1; then
              execution_tag=$tag
              break
            fi
          done < <(gh api --paginate "repos/$GITHUB_REPOSITORY/tags?per_page=100" --jq '.[].name' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+(-[a-z0-9.]+)?$' | sort -rV)
          if [ -z "$execution_tag" ]; then
            echo "No release tag contains scripts/sign-plugin-set.py yet." >&2
            exit 1
          fi
          if [ "$AUTO" = true ] && [ -z "$PENDING" ]; then
            # A common set of newer upstream versions: from the newest tag,
            # if it knows the check; an older one keeps the approval.
            if gh api "repos/$GITHUB_REPOSITORY/contents/scripts/plugin-guard.py?ref=$execution_tag" >/dev/null 2>&1; then
              PENDING=$execution_tag
            else
              AUTO=false
            fi
          fi
          if [ "$AUTO" = true ]; then
            # One automatic run at a time; it signs every set it finds.
            for state in queued in_progress; do
              if [ "$(gh run list --workflow plugin-sign.yml --event workflow_dispatch --status "$state" --json databaseId --jq length)" != 0 ]; then
                echo "A signing run is $state already."
                exit 0
              fi
            done
            # From the autopilot tag itself (newer tags of the owner may
            # predate the input auto), or the newest tag for upstream versions.
            gh workflow run plugin-sign.yml --repo "$GITHUB_REPOSITORY" --ref "$PENDING" -f auto=true
            echo "Signing run started from $PENDING without approval."
            exit 0
          fi
          # A run that already waits for approval is enough.
          if [ "$(gh run list --workflow plugin-sign.yml --event workflow_dispatch --status waiting --json databaseId --jq length)" != 0 ]; then
            echo "A signing run is already waiting for approval."
            exit 0
          fi
          gh workflow run plugin-sign.yml --repo "$GITHUB_REPOSITORY" --ref "$execution_tag"
          echo "Signing run started from $execution_tag; it waits for the approval of the environment release."

  sign:
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Both environments hold the signing key; release asks for an approval.
    # security-release only for auto=true, which the dispatch job above sets
    # only with AUTOPILOT_PLUGINS=on and an autopilot tag waiting.
    environment: ${{ inputs.auto && vars.AUTOPILOT_PLUGINS == 'on' && 'security-release' || 'release' }}
    env:
      GH_TOKEN: ${{ secrets.PLUGINS_DISPATCH_TOKEN }}
      AUTO: ${{ inputs.auto && vars.AUTOPILOT_PLUGINS == 'on' }}
    steps:
      # The signer (scripts/sign-plugin-set.py) and the public keys of the
      # image, from this tag. Nothing of the plugin repository is checked out
      # or run here: its drafts are only data, and only a signature the image
      # accepts leaves the job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The tags: without the approval, kernel sets only for a waiting
          # autopilot release (scripts/autopilot.py pending).
          fetch-depth: 0
          persist-credentials: false
      - name: Sign and publish
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends minisign
          if [ -z "$MINISIGN_SECRET_KEY" ] || [ -z "$GH_TOKEN" ]; then
            echo "the environment of this job holds no MINISIGN_SECRET_KEY, or PLUGINS_DISPATCH_TOKEN is missing" >&2
            exit 1
          fi
          python3 scripts/check-release-keys.py build/mkosi.extra/usr/share/titanos/update-keys
          pending=
          if [ "$AUTO" = true ]; then
            pending=$(python3 scripts/autopilot.py pending | sed -n 's/^pending=//p')
          fi
          key=$(mktemp)
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key"
          releases=$(gh api "repos/$PLUGINS/releases?per_page=100")
          # Kernel sets before the common set before driver updates.
          for tag in $(jq -r "$DRAFTS | sort_by(if startswith(\"kernel-\") then 0 elif startswith(\"common-\") then 1 else 2 end) | .[]" <<<"$releases"); do
            if [ "$AUTO" = true ] && [[ $tag == pending-nvidia-* ]]; then
              echo "$tag keeps the approval (driver update)."
              continue
            fi
            # Without an approval: the sets of a waiting autopilot release, or
            # a common set that only brings newer upstream versions.
            if [ "$AUTO" = true ] && [ -z "$pending" ] && { [[ $tag != common-* ]] || ! scripts/plugin-common-check.sh "$tag"; }; then
              echo "$tag keeps the approval."
              continue
            fi
            # A set built twice (a repeated release run) leaves drafts with the
            # same tag: sign the newest, drop the older ones.
            ids=$(jq -r --arg t "$tag" '[.[] | select(.draft and .tag_name == $t)] | sort_by(.created_at) | .[].id' <<<"$releases")
            id=$(tail -n 1 <<<"$ids")
            for older in $(head -n -1 <<<"$ids"); do
              gh api -X DELETE "repos/$PLUGINS/releases/$older"
              echo "$tag: older draft $older removed."
            done
            dir=$(mktemp -d)
            while IFS=$'\t' read -r asset name; do
              [[ $name =~ ^[A-Za-z0-9][A-Za-z0-9._+-]{0,120}$ ]] || { echo "odd asset name $name" >&2; exit 1; }
              gh api -H 'Accept: application/octet-stream' "repos/$PLUGINS/releases/assets/$asset" > "$dir/$name"
            done < <(gh api "repos/$PLUGINS/releases/$id/assets?per_page=100" --jq '.[] | [.id, .name] | @tsv')
            upload() {
              gh api -X POST -H 'Content-Type: application/octet-stream' --input "$2" \
                "https://uploads.github.com/repos/$PLUGINS/releases/$1/assets?name=$(basename "$2")" >/dev/null
            }
            if [[ $tag == pending-nvidia-* ]]; then
              set_tag=${tag#pending-nvidia-*-}
              set_tag=kernel-${set_tag#kernel-}
              [ "$(jq -r .tag "$dir/target.json")" = "$set_tag" ] || { echo "$tag does not belong to $set_tag" >&2; exit 1; }
              # Signs the update and nvidia-updates.json, then checks them.
              python3 scripts/sign-plugin-set.py nvidia "$dir" "$key"
              gh release upload "$set_tag" --repo "$PLUGINS" "$dir"/nvidia-update-*
              gh release upload "$set_tag" --repo "$PLUGINS" "$dir/nvidia-updates.json" "$dir/nvidia-updates.json.minisig" --clobber
              gh api -X DELETE "repos/$PLUGINS/releases/$id"
              echo "Driver update of $set_tag published."
              continue
            fi
            rm -f "$dir"/*.minisig
            # Every file of a set must come out of release.yml of the plugin
            # repository on its main branch (the attestation its job draft
            # makes). A draft someone else wrote, or a file swapped in one,
            # has none: it is left unsigned and the run fails.
            proven=true
            for file in "$dir"/*; do
              if ! gh attestation verify "$file" --repo "$PLUGINS" --signer-workflow "$PLUGINS/.github/workflows/release.yml" --source-ref refs/heads/main >/dev/null 2>"$dir.err"; then
                echo "::error::$tag: $(basename "$file") has no proof of where it was built: $(tail -n 1 "$dir.err")"
                proven=false
              fi
            done
            if [ "$proven" != true ]; then
              unproven=true
              continue
            fi
            # Signs manifests and index, then checks the set against the keys
            # of the image: only a signature the image accepts goes out.
            python3 scripts/sign-plugin-set.py set "$dir" "$key"
            for signature in "$dir"/*.minisig; do upload "$id" "$signature"; done
            gh api -X PATCH "repos/$PLUGINS/releases/$id" -F draft=false -f make_latest=false >/dev/null
            current=-
            rm -rf catalog-current catalog-new
            if gh release download catalog --repo "$PLUGINS" -p 'catalog.json*' -D catalog-current; then current=catalog-current; fi
            python3 scripts/sign-plugin-set.py pointer "$dir" "$current" catalog-new "$key"
            if ! gh release view catalog --repo "$PLUGINS" >/dev/null 2>&1; then
              gh release create catalog --repo "$PLUGINS" --title "Plugin catalog" --latest=false \
                --notes "Signed pointer to the current plugin sets (catalog.json). TitanOS reads it; see docs/PLUGIN-REPO.md in ra5on/TitanOS."
            fi
            gh release upload catalog --repo "$PLUGINS" catalog-new/catalog.json catalog-new/catalog.json.minisig --clobber
            echo "$tag published, catalog updated."
          done
          if [ "${unproven:-false}" = true ]; then
            echo "At least one set was not signed: see the errors above." >&2
            exit 1
          fi
