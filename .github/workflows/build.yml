name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read pinned toolchain versions
        id: lock
        run: |
          echo "node=$(jq -er .node.version scripts/dev-toolchains.lock.json)" >> "$GITHUB_OUTPUT"
          echo "go=$(jq -er .go.version scripts/dev-toolchains.lock.json)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.lock.outputs.node }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.lock.outputs.go }}
          cache-dependency-path: backend/go.sum

      - name: Release regression test tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends shellcheck squashfs-tools minisign zip xz-utils qemu-utils iptables iproute2 kmod dnsmasq-base busybox ovmf restic poppler-utils tesseract-ocr tesseract-ocr-deu tesseract-ocr-eng

      - name: Open firewall, guest DHCP and bridge forwarding
        run: |
          sudo modprobe br_netfilter
          sudo unshare --net python3 scripts/test-bridge-forwarding.py

      - name: Test
        run: make test test-release

      - name: Build titand with web UI
        run: make build

      - name: Check formatting
        run: test -z "$(gofmt -l backend)"

      # staticcheck, govulncheck, shellcheck and actionlint (Makefile).
      - name: Lint
        run: make lint

      # Opens every page of a development titand and clicks every button, so
      # a page that breaks while rendering ("500 Internal Error") cannot ship.
      - name: Browser for the page crawl
        run: |
          npm install --prefix "$RUNNER_TEMP/playwright" --no-save --ignore-scripts playwright@1.56.1
          "$RUNNER_TEMP/playwright/node_modules/.bin/playwright" install --with-deps chromium

      - name: Crawl every page of titand -dev
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/playwright/node_modules/playwright/index.mjs
          UI_URL: http://127.0.0.1:18080
          UI_OUTPUT: ${{ runner.temp }}/ui-crawl
        run: |
          config="$RUNNER_TEMP/titand-config"
          mkdir -p "$config/users"
          backend/bin/titand -dev -config "$config" -dev-listen 127.0.0.1:18080 > "$RUNNER_TEMP/titand.log" 2>&1 &
          for _ in $(seq 30); do curl -sf -o /dev/null "$UI_URL/api/v1/session" && break; sleep 1; done
          password="$(openssl rand -hex 16)"
          curl -sf -H 'Content-Type: application/json' -H "Origin: $UI_URL" \
            -d "{\"name\":\"crawler\",\"password\":\"$password\"}" "$UI_URL/api/v1/setup" > /dev/null
          UI_LOGIN="crawler:$password" node scripts/test-ui-crawl.mjs

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: ui-crawl
          path: |
            ${{ runner.temp }}/ui-crawl
            ${{ runner.temp }}/titand.log
          if-no-files-found: ignore

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: titand-linux-amd64
          path: |
            backend/bin/titand
            backend/bin/titanosctl
          if-no-files-found: error
