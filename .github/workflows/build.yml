name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache-dependency-path: backend/go.sum

      - name: Release regression test tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends squashfs-tools minisign zip xz-utils qemu-utils iptables iproute2 kmod dnsmasq-base busybox ovmf restic poppler-utils tesseract-ocr tesseract-ocr-deu tesseract-ocr-eng

      - name: Open firewall, guest DHCP and bridge forwarding
        run: |
          sudo modprobe br_netfilter
          sudo unshare --net python3 scripts/test-bridge-forwarding.py

      - name: Test
        run: make test test-release

      - name: Build titand with web UI
        run: make build

      - name: Check formatting
        run: test -z "$(gofmt -l backend)"

      - uses: actions/upload-artifact@v7
        with:
          name: titand-linux-amd64
          path: |
            backend/bin/titand
            backend/bin/titanosctl
          if-no-files-found: error
