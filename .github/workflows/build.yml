name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          # No dependencies yet, so there is no go.sum to key a cache on.
          cache: false

      - name: Test
        run: make test

      - name: Build titand with web UI
        run: make build

      - name: Check formatting
        run: test -z "$(gofmt -l backend)"

      - uses: actions/upload-artifact@v7
        with:
          name: titand-linux-amd64
          path: backend/bin/titand
          if-no-files-found: error
