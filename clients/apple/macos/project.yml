name: Titan
options:
  bundleIdPrefix: io.github.ra5on.titanos
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  TitanKit:
    path: ../TitanKit
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.6

schemes:
  Titan:
    build:
      targets:
        Titan: all
    run:
      config: Debug
    archive:
      config: Release
    test:
      config: Debug
      targets:
        - TitanTests

targets:
  TitanTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
      # Compile the production mount implementation directly so these remain
      # unhosted logic tests and never launch the menu-bar app or touch volumes.
      - path: Sources/Titan/Mounter.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.ra5on.titanos.mac.tests
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES

  Titan:
    type: application
    platform: macOS
    sources:
      - path: Sources/Titan
        excludes:
          - Resources
      - path: Sources/Titan/Resources
        buildPhase: resources
      # Shared Icon Composer source used by both the iOS and macOS apps.
      - path: ../AppIcon.icon
        type: file
        buildPhase: resources
    dependencies:
      - package: TitanKit
      - package: Sparkle
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Titan
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleIconFile: AppIcon
        CFBundleIconName: AppIcon
        LSApplicationCategoryType: public.app-category.utilities
        LSUIElement: true
        NSLocalNetworkUsageDescription: Titan finds your Titan devices on your local network.
        NSNetworkVolumesUsageDescription: Titan mounts your Titan's shared folders so you can browse them in Finder.
        NSBonjourServices:
          - _titan._tcp.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          # Allow credential-free discovery over Tailscale's CGNAT range. Supported
          # devices still prove identity over pinned HTTPS before credentials are sent.
          NSExceptionDomains:
            "100.64.0.0/10":
              NSExceptionAllowsInsecureHTTPLoads: true
        NSHumanReadableCopyright: Umbrel, Inc.
        # Sparkle is embedded in the app; both the feed and release artifacts are
        # disabled until a separately signed Titan macOS release feed is configured.
        SUEnableAutomaticChecks: false
        SUAutomaticallyUpdate: false
        SURequireSignedFeed: true
        SUVerifyUpdateBeforeExtraction: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.ra5on.titanos.mac
        PRODUCT_NAME: Titan
        MARKETING_VERSION: "0.1.1"
        CURRENT_PROJECT_VERSION: "25"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Titan.entitlements
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_VERSION: "5.9"
