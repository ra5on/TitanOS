name: Titan
options:
  bundleIdPrefix: io.github.ra5on.titanos
  deploymentTarget:
    # Active upload-job reconciliation uses PhotoKit's Action.process API.
    iOS: "26.5"
  createIntermediateGroups: true

packages:
  TitanKit:
    path: ../TitanKit

schemes:
  Titan:
    build:
      targets:
        Titan: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TitanTests
        - TitanUITests

targets:
  TitanTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Titan
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.ra5on.titanos.app.tests
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Titan.app/Titan
        BUNDLE_LOADER: $(TEST_HOST)
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: io.github.ra5on.titanos.app.dev.tests

  TitanUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Titan
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.ra5on.titanos.app.uitests
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Titan
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: io.github.ra5on.titanos.app.dev.uitests

  Titan:
    type: application
    platform: iOS
    sources:
      - path: Sources
      # Shared Icon Composer source used by both the iOS and macOS apps.
      - path: ../AppIcon.icon
        type: file
        buildPhase: resources
    dependencies:
      - package: TitanKit
      - target: TitanPhotoBackgroundUpload
        embed: true
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Titan
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        # Black launch background so cold launch doesn't flash white before the app
        UILaunchScreen:
          UIColorName: LaunchBackground
        # Discovery: browse _titan._tcp on the local network (same as macOS Connect)
        NSLocalNetworkUsageDescription: Titan finds your Titan devices on your local network.
        NSBonjourServices:
          - _titan._tcp
        # Native API traffic uses pinned HTTPS over both LAN and Tailscale. PhotoKit
        # background uploads still use HTTP to a Tailscale-range literal, so keep this
        # narrow exception without allowing arbitrary internet HTTP.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          # Since iOS 17, HTTP to literal IPs needs an explicit address exception.
          # Limit it to Tailscale's CGNAT range. Every saved endpoint is
          # identity-checked before use.
          NSExceptionDomains:
            "100.64.0.0/10":
              NSExceptionAllowsInsecureHTTPLoads: true
        # Photo backup reads the library to upload photos and videos to the user's Titan
        NSPhotoLibraryUsageDescription: Choose Allow Full Access to automatically back up the photos and videos in your library to your Titan.
        # Apple permits an App Group identifier to scope Keychain items shared with an
        # extension. Only the photo upload grant is written into this group.
        TitanPhotoBackupKeychainAccessGroup: $(APP_GROUP_IDENTIFIER)
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.ra5on.titanos.app
        APP_GROUP_IDENTIFIER: group.io.github.ra5on.titanos.app.photos
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "28"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
        CODE_SIGN_ENTITLEMENTS: Titan.entitlements
        # Configure your own Apple signing team locally before distributing native clients.
        CODE_SIGN_STYLE: Automatic
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: io.github.ra5on.titanos.app.dev
          APP_GROUP_IDENTIFIER: group.io.github.ra5on.titanos.app.dev

  TitanPhotoBackgroundUpload:
    type: extensionkit-extension
    platform: iOS
    sources:
      - path: BackgroundUploadExtension
    dependencies:
      - package: TitanKit
    info:
      path: BackgroundUploadExtension/Info.plist
      properties:
        CFBundleDisplayName: Titan Photo Backup
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # PhotoKit requires one signed BackgroundUploadURLBase for network validation,
        # but it cannot vary per user's Titan. Actual jobs use the verified Tailscale
        # address in shared configuration. In a clean-install iOS 26.6.1 physical test,
        # this key was http://titan-photo-upload-test.invalid while jobs successfully
        # uploaded to a verified 100.64.0.0/10 address with the phone locked. Apple does
        # not document this separate-host behavior, so keep it in physical release tests.
        BackgroundUploadURLBase: http://titan.local
        TitanPhotoBackupKeychainAccessGroup: $(APP_GROUP_IDENTIFIER)
        EXAppExtensionAttributes:
          EXExtensionPointIdentifier: com.apple.photos.background-upload
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            "100.64.0.0/10":
              NSExceptionAllowsInsecureHTTPLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.ra5on.titanos.app.photo-background-upload
        APP_GROUP_IDENTIFIER: group.io.github.ra5on.titanos.app.photos
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "28"
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_ENTITLEMENTS: BackgroundUploadExtension/TitanPhotoBackgroundUpload.entitlements
        CODE_SIGN_STYLE: Automatic
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: io.github.ra5on.titanos.app.dev.photo-background-upload
          APP_GROUP_IDENTIFIER: group.io.github.ra5on.titanos.app.dev
