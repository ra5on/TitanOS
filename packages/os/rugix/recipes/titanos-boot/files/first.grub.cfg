# Titan recovery menu. Preserve Rugix v0.9.3's verified default and one-shot trial.
set rugpi_bootpart=2
set rugpi_boot_spare=false
set titan_config_root=$root
set RUGPI_SPARE_ENV=(${root})/rugpi/boot_spare.grubenv

function verify_and_load {
    env_file="${1}"
    sha1_file="${1}.sha1"
    hashsum --hash sha1 --check "${sha1_file}"
    if [ $? != 0 ]; then
        echo "Rugix boot environment is corrupt."
        return 1
    else
        load_env -f "${env_file}"
        return 0
    fi
}

verify_and_load "(${root})/rugpi/secondary.grubenv"
verify_and_load "(${root})/rugpi/primary.grubenv"
load_env -f "${RUGPI_SPARE_ENV}"

# A trial is consumed before the kernel starts, just as in the pinned Rugix
# loader. An unconfirmed or failed trial therefore falls back on the next boot.
if [ "${rugpi_boot_spare}" = "true" ]; then
    if [ "${rugpi_bootpart}" = "2" ]; then
        set rugpi_bootpart=3
    elif [ "${rugpi_bootpart}" = "3" ]; then
        set rugpi_bootpart=2
    fi
    set rugpi_boot_spare=false
    save_env -f "${RUGPI_SPARE_ENV}" rugpi_boot_spare
    set rugpi_boot_spare=true
fi
set titan_automatic_part=$rugpi_bootpart
regexp (.*),(.*) $root -s 1:rugpi_root_device

# Only load Titan's presentation variables; they cannot alter Rugix's default,
# spare marker, disk selection or kernel arguments. The root updater writes a
# previous entry only after checking signed evidence and the native slot hashes.
set titan_rollback_part=
set titan_rollback_version=
if [ -f (${titan_config_root})/rugpi/titan-menu.grubenv ]; then
    load_env -f (${titan_config_root})/rugpi/titan-menu.grubenv titan_a_version titan_b_version titan_rollback_part titan_rollback_version
fi
set titan_slot_version=TitanOS
if [ -f (${rugpi_root_device},${titan_automatic_part})/titan-version.grubenv ]; then
    load_env -f (${rugpi_root_device},${titan_automatic_part})/titan-version.grubenv titan_slot_version
fi
if [ "${titan_automatic_part}" = "2" -a -n "${titan_a_version}" ]; then
    set titan_slot_version=$titan_a_version
elif [ "${titan_automatic_part}" = "3" -a -n "${titan_b_version}" ]; then
    set titan_slot_version=$titan_b_version
fi

function titan_boot {
    set rugpi_bootpart=$1
    if [ "${rugpi_bootpart}" = "2" ]; then
        set rugpi_syspart=4
    elif [ "${rugpi_bootpart}" = "3" ]; then
        set rugpi_syspart=5
    else
        echo "Invalid TitanOS system slot."
        return 1
    fi
    echo "TITAN_BOOT_SELECTED part=${rugpi_bootpart} trial=${rugpi_boot_spare}"
    set root=(${rugpi_root_device},${rugpi_bootpart})
    if [ -f (${root})/grub.cfg ]; then
        source (${root})/grub.cfg
    fi
    echo "TitanOS could not start. Restarting returns to the confirmed slot."
    sleep --verbose --interruptible 10
    reboot
}

serial --unit=0 --speed=115200
terminal_input console serial
terminal_output console serial
set timeout_style=menu
set timeout=5
set default=0
export titan_automatic_part rugpi_root_device rugpi_boot_spare
export titan_rollback_part

menuentry "TitanOS ${titan_slot_version} starten" --id titan-current {
    titan_boot $titan_automatic_part
}
# Do not interrupt a native update trial by offering another slot. A fresh
# installation and unknown, corrupt or overwritten slots get no recovery entry.
if [ "${rugpi_boot_spare}" != "true" -a -n "${titan_rollback_version}" ]; then
    if [ "${titan_rollback_part}" = "2" -o "${titan_rollback_part}" = "3" ]; then
        if [ "${titan_rollback_part}" != "${titan_automatic_part}" ]; then
            if [ -f (${rugpi_root_device},${titan_rollback_part})/grub.cfg ]; then
                menuentry "Vorherige Version ${titan_rollback_version} starten" --id titan-previous {
                    # A manual recovery is a trial too. Healthy userspace must
                    # validate and commit it; otherwise the default stays intact.
                    set rugpi_boot_spare=true
                    titan_boot $titan_rollback_part
                }
            fi
        fi
    fi
fi

echo "TITAN_BOOT_MENU automatic=${titan_automatic_part} previous=${titan_rollback_part}"
