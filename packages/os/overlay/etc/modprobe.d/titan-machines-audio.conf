# Eight loopback cards with eight PCM substreams each provide independent
# playback/capture pairs for up to 64 concurrently running Titan machines.
# Card indexes 8-15 stay clear of ordinary host audio hardware.
options snd-aloop index=8,9,10,11,12,13,14,15 id=TitanVM0,TitanVM1,TitanVM2,TitanVM3,TitanVM4,TitanVM5,TitanVM6,TitanVM7 enable=1,1,1,1,1,1,1,1 pcm_substreams=8,8,8,8,8,8,8,8
