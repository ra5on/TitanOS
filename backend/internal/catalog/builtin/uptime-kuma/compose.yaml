x-titanos:
  name: Uptime Kuma
  category: network
  description:
    de: Überwacht Webseiten und Dienste und meldet Ausfälle.
    en: Watches websites and services and tells you when one is down.
  paths:
    /app/data:
      label: { de: Daten, en: Data }
  ports:
    "3001":
      label: WebUI
      webui: true

services:
  uptime-kuma:
    image: louislam/uptime-kuma:2
    restart: unless-stopped
    environment:
      TZ: ""
    volumes:
      - "./data:/app/data"
    ports:
      - "3001:3001"
