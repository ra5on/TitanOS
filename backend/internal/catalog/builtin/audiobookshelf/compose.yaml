x-titanos:
  name: Audiobookshelf
  category: media
  description:
    de: Hörbücher und Podcasts streamen, mit Fortschritt pro Gerät.
    en: Stream audiobooks and podcasts, with progress kept per device.
  paths:
    /audiobooks:
      label: { de: Hörbücher, en: Audiobooks }
      suggest: media
    /podcasts:
      label: Podcasts
      suggest: media
    /config:
      label: { de: Konfiguration, en: Configuration }
    /metadata:
      label: { de: Metadaten, en: Metadata }
  ports:
    "80":
      label: WebUI
      webui: true

services:
  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    restart: unless-stopped
    environment:
      TZ: ""
    volumes:
      - "./audiobooks:/audiobooks"
      - "./podcasts:/podcasts"
      - "./config:/config"
      - "./metadata:/metadata"
    ports:
      - "13378:80"
