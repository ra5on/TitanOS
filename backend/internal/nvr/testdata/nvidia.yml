# Written by TitanOS (NVR). Do not edit: every change of the settings
# or cameras in TitanOS replaces this file.
version: 0.18-0
mqtt:
  enabled: false
auth:
  enabled: false
proxy:
  auth_secret: goldensecretgoldensecretgoldensecretgoldensecret0123
  default_role: admin
tls:
  enabled: false
networking:
  listen:
    internal: 127.0.0.1:5000
    external: 8971
telemetry:
  version_check: false
detectors:
  ov:
    type: openvino
    device: CPU
model:
  width: 300
  height: 300
  input_tensor: nhwc
  input_pixel_format: bgr
  path: /openvino-model/ssdlite_mobilenet_v2.xml
  labelmap_path: /openvino-model/coco_91cl_bkgr.txt
ffmpeg:
  hwaccel_args: preset-nvidia
record:
  continuous:
    days: 30
  motion:
    days: 30
birdseye:
  enabled: false
lpr:
  enabled: false
face_recognition:
  enabled: false
go2rtc:
  api:
    listen: 127.0.0.1:1984
  rtsp:
    listen: 127.0.0.1:8554
  webrtc:
    candidates: []
  streams:
    haustuer:
      - rtsp://viewer:geheim@192.168.1.61:554/Streaming/Channels/101#backchannel=0
      - ffmpeg:haustuer#audio=opus
    haustuer_sub:
      - rtsp://viewer:geheim@192.168.1.61:554/Streaming/Channels/102#backchannel=0
    haustuer_twoway:
      - rtsp://viewer:geheim@192.168.1.61:554/Streaming/Channels/101
    hof:
      - rtsp://viewer:geheim@192.168.1.61:554/Streaming/Channels/101#backchannel=0
  preload:
    haustuer: ""
    haustuer_sub: ""
    hof: ""
cameras:
  haustuer:
    enabled: true
    ffmpeg:
      output_args:
        record: preset-record-generic-audio-copy
      inputs:
        - path: rtsp://127.0.0.1:8554/haustuer
          input_args: preset-rtsp-restream
          roles:
            - record
        - path: rtsp://127.0.0.1:8554/haustuer_sub
          input_args: preset-rtsp-restream
          roles:
            - detect
    detect:
      enabled: true
      fps: 5
    objects:
      track:
        - person
    record:
      enabled: true
      continuous:
        days: 0
      motion:
        days: 0
      alerts:
        pre_capture: 5
        post_capture: 5
        retain:
          days: 14
          mode: all
      detections:
        pre_capture: 5
        post_capture: 5
        retain:
          days: 14
          mode: all
    snapshots:
      enabled: true
      retain:
        default: 14
    audio:
      enabled: false
  hof:
    enabled: true
    ffmpeg:
      output_args:
        record: preset-record-generic-audio-aac
      inputs:
        - path: rtsp://127.0.0.1:8554/hof
          input_args: preset-rtsp-restream
          roles:
            - record
        - path: rtsp://127.0.0.1:8554/hof
          input_args: preset-rtsp-restream
          roles:
            - detect
    detect:
      enabled: true
      fps: 5
    objects:
      track:
        - person
    record:
      enabled: true
      continuous:
        days: 0
      motion:
        days: 0
      alerts:
        pre_capture: 5
        post_capture: 5
        retain:
          days: 14
          mode: all
      detections:
        pre_capture: 5
        post_capture: 5
        retain:
          days: 14
          mode: all
    snapshots:
      enabled: true
      retain:
        default: 14
    audio:
      enabled: false
