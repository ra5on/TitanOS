# Written by TitanOS (NVR). Do not edit: every change of the settings
# or cameras in TitanOS replaces this file.
version: 0.18-0
mqtt:
  enabled: false
auth:
  enabled: false
proxy:
  auth_secret: goldensecretgoldensecretgoldensecretgoldensecret0123
  default_role: admin
tls:
  enabled: false
networking:
  listen:
    internal: 127.0.0.1:5000
    external: 8971
telemetry:
  version_check: false
detectors:
  hailo:
    type: hailo8l
    device: PCIe
model:
  width: 320
  height: 320
  input_tensor: nhwc
  input_pixel_format: rgb
  input_dtype: int
  model_type: yolo-generic
  labelmap_path: /labelmap/coco-80.txt
ffmpeg:
  hwaccel_args: preset-vaapi
record:
  continuous:
    days: 14
  motion:
    days: 14
birdseye:
  enabled: false
lpr:
  enabled: false
face_recognition:
  enabled: false
go2rtc:
  api:
    listen: 127.0.0.1:1984
  rtsp:
    listen: 127.0.0.1:8554
  webrtc:
    candidates: []
  streams:
    tor:
      - rtsp://viewer:geheim@192.168.1.61:554/Streaming/Channels/101#backchannel=0
    tor_sub:
      - rtsp://viewer:geheim@192.168.1.61:554/Streaming/Channels/102#backchannel=0
cameras:
  tor:
    enabled: true
    ffmpeg:
      output_args:
        record: preset-record-generic-audio-aac
      inputs:
        - path: rtsp://127.0.0.1:8554/tor
          input_args: preset-rtsp-restream
          roles:
            - record
        - path: rtsp://127.0.0.1:8554/tor_sub
          input_args: preset-rtsp-restream
          roles:
            - detect
    detect:
      enabled: true
      fps: 5
    objects:
      track:
        - person
    record:
      enabled: true
      continuous:
        days: 0
      motion:
        days: 0
      alerts:
        pre_capture: 5
        post_capture: 5
        retain:
          days: 14
          mode: active_objects
      detections:
        pre_capture: 5
        post_capture: 5
        retain:
          days: 14
          mode: active_objects
    snapshots:
      enabled: true
      retain:
        default: 14
    audio:
      enabled: false
