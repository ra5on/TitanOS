<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TitanOS-Agent</title>
<style>
	:root {
		--bg: #15181d;
		--surface: #1e232a;
		--border: #313842;
		--text: #e6e9ee;
		--muted: #9aa3ae;
		--accent: #4c8dff;
		--on-accent: #ffffff;
		--ok: #3fb950;
		--warn: #d29922;
		--error: #f85149;
		--radius: 10px;
		color-scheme: dark;
	}
	@media (prefers-color-scheme: light) {
		:root {
			--bg: #f4f6f8;
			--surface: #ffffff;
			--border: #d5dbe2;
			--text: #1b1f24;
			--muted: #5b6570;
			--accent: #1f5fd1;
			--ok: #1a7f37;
			--warn: #9a6700;
			--error: #cf222e;
			color-scheme: light;
		}
	}
	* { box-sizing: border-box; }
	html, body { height: 100%; }
	body {
		margin: 0;
		display: flex;
		flex-direction: column;
		background: var(--bg);
		color: var(--text);
		font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
	}
	header {
		display: flex;
		flex-wrap: wrap;
		align-items: center;
		gap: 10px 16px;
		padding: 12px 16px;
		border-bottom: 1px solid var(--border);
		background: var(--surface);
	}
	h1 { margin: 0; font-size: 1rem; font-weight: 600; }
	h1 span { color: var(--accent); }
	.status { display: flex; flex-wrap: wrap; gap: 8px; margin-left: auto; font-size: 0.8125rem; }
	.pill { padding: 2px 10px; border: 1px solid var(--border); border-radius: 999px; color: var(--muted); }
	.pill.ok::before, .pill.bad::before { content: "● "; }
	.pill.ok::before { color: var(--ok); }
	.pill.bad::before { color: var(--error); }
	select, textarea, button { font: inherit; color: inherit; }
	select {
		max-width: 220px;
		padding: 4px 8px;
		border: 1px solid var(--border);
		border-radius: 8px;
		background: var(--bg);
	}
	main { flex: 1; overflow-y: auto; padding: 16px; }
	.log { display: flex; flex-direction: column; gap: 12px; max-width: 860px; margin: 0 auto; }
	.msg { padding: 10px 14px; border-radius: var(--radius); overflow-wrap: anywhere; }
	.msg.user { align-self: flex-end; max-width: 85%; background: var(--accent); color: var(--on-accent); white-space: pre-wrap; }
	.msg.assistant { align-self: stretch; background: var(--surface); border: 1px solid var(--border); }
	.msg.problem { border: 1px solid var(--error); background: var(--surface); }
	.msg p { margin: 0 0 8px; }
	.msg p:last-child { margin-bottom: 0; }
	.msg ul { margin: 0 0 8px; padding-left: 20px; }
	.msg code { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 0.875em; }
	.msg pre { margin: 0 0 8px; padding: 8px 10px; overflow-x: auto; background: var(--bg); border-radius: 6px; }
	.tools { display: flex; flex-wrap: wrap; gap: 6px; font-size: 0.75rem; }
	.tool { padding: 1px 8px; border-radius: 6px; background: var(--bg); border: 1px solid var(--border); color: var(--muted); font-family: ui-monospace, Menlo, monospace; }
	.tool.failed { border-color: var(--warn); color: var(--warn); }
	.thinking { color: var(--muted); font-size: 0.875rem; }
	.empty { max-width: 860px; margin: 8vh auto 0; color: var(--muted); text-align: center; }
	.empty h2 { margin: 0 0 6px; color: var(--text); font-size: 1.125rem; }
	.suggestions { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 16px; }
	.suggestions button, .send, .clear {
		padding: 6px 12px;
		border: 1px solid var(--border);
		border-radius: 8px;
		background: var(--surface);
		cursor: pointer;
	}
	.suggestions button:hover, .clear:hover { border-color: var(--accent); }
	.problems { max-width: 860px; margin: 0 auto 12px; }
	.problems p { margin: 0 0 6px; padding: 8px 12px; border: 1px solid var(--error); border-radius: 8px; font-size: 0.875rem; }
	form {
		display: flex;
		gap: 8px;
		padding: 12px 16px;
		border-top: 1px solid var(--border);
		background: var(--surface);
	}
	form > div { display: flex; gap: 8px; width: 100%; max-width: 860px; margin: 0 auto; }
	textarea {
		flex: 1;
		min-height: 44px;
		max-height: 200px;
		padding: 10px 12px;
		border: 1px solid var(--border);
		border-radius: var(--radius);
		background: var(--bg);
		resize: none;
	}
	textarea:focus, select:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
	.send { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
	.send:disabled { opacity: 0.6; cursor: default; }
	.note { max-width: 860px; margin: 6px auto 0; color: var(--muted); font-size: 0.75rem; text-align: center; }
</style>
</head>
<body>
<header>
	<h1>Titan<span>OS</span>-Agent</h1>
	<select id="model"></select>
	<button type="button" class="clear" id="clear"></button>
	<div class="status" id="status"></div>
</header>
<main id="main">
	<div class="problems" id="problems"></div>
	<div class="empty" id="empty">
		<h2 id="emptyTitle"></h2>
		<p id="emptyText"></p>
		<div class="suggestions" id="suggestions"></div>
	</div>
	<div class="log" id="log" aria-live="polite"></div>
</main>
<form id="form">
	<div>
		<textarea id="input" rows="1"></textarea>
		<button type="submit" class="send" id="send"></button>
	</div>
</form>
<script>
	const $ = (id) => document.getElementById(id);
	const TEXTS = {
		de: {
			model: 'Modell', clear: 'Neuer Chat', connecting: 'Verbinde …', title: 'Frag dein NAS',
			text: 'Der Agent liest den Zustand von TitanOS über dessen MCP-Werkzeuge und antwortet mit deinem Modell aus Ollama. Er ändert nichts.',
			placeholder: 'Zum Beispiel: Ist mit meinen Platten alles in Ordnung?', message: 'Nachricht', send: 'Senden',
			thinking: 'Denkt nach …', reading: 'Liest {tool} …', tools: '{n} Werkzeuge', noAnswer: '(keine Antwort)',
			down: 'Der Agent antwortet nicht.', status: 'Der Agent antwortet {status}.',
			suggestions: ['Ist mit meinen Volumes und Platten alles in Ordnung?', 'Welche Container laufen, und gibt es Updates?', 'Sind meine Backups aktuell?', 'Gab es heute Fehler im Systemprotokoll?', 'Wie warm sind CPU und Platten?']
		},
		en: {
			model: 'Model', clear: 'New chat', connecting: 'Connecting …', title: 'Ask your NAS',
			text: 'The agent reads the state of TitanOS through its MCP tools and answers with your model from Ollama. It changes nothing.',
			placeholder: 'For example: Are my disks all right?', message: 'Message', send: 'Send',
			thinking: 'Thinking …', reading: 'Reading {tool} …', tools: '{n} tools', noAnswer: '(no answer)',
			down: 'The agent does not answer.', status: 'The agent answered {status}.',
			suggestions: ['Are my volumes and disks all right?', 'Which containers are running, and are there updates?', 'Are my backups up to date?', 'Were there errors in the system log today?', 'How warm are the CPU and the disks?']
		}
	};
	const lang = navigator.language?.toLowerCase().startsWith('de') ? 'de' : 'en';
	const T = TEXTS[lang];
	const fill = (text, values) => text.replace(/\{(\w+)\}/g, (_, key) => values[key]);
	document.documentElement.lang = lang;
	$('model').setAttribute('aria-label', T.model);
	$('clear').textContent = T.clear;
	$('status').innerHTML = `<span class="pill">${T.connecting}</span>`;
	$('emptyTitle').textContent = T.title;
	$('emptyText').textContent = T.text;
	$('input').placeholder = T.placeholder;
	$('input').setAttribute('aria-label', T.message);
	$('send').textContent = T.send;
	const store = {
		get: (key) => { try { return localStorage.getItem(key); } catch { return null; } },
		set: (key, value) => { try { localStorage.setItem(key, value); } catch { /* private mode */ } }
	};
	let history = [];
	let busy = false;

	function escape(text) {
		return text.replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
	}

	// A small, safe subset of Markdown: everything is escaped first.
	function markdown(text) {
		const blocks = escape(text).split(/```[a-z]*\n?/);
		return blocks.map((block, i) => {
			if (i % 2 === 1) return `<pre><code>${block.replace(/\n$/, '')}</code></pre>`;
			return block.split(/\n{2,}/).map((para) => {
				const inline = (s) => s
					.replace(/`([^`]+)`/g, '<code>$1</code>')
					.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
				const lines = para.split('\n').filter((l) => l.trim() !== '');
				if (lines.length && lines.every((l) => /^\s*([-*]|\d+\.)\s+/.test(l))) {
					return '<ul>' + lines.map((l) => `<li>${inline(l.replace(/^\s*([-*]|\d+\.)\s+/, ''))}</li>`).join('') + '</ul>';
				}
				return lines.length ? `<p>${lines.map(inline).join('<br>')}</p>` : '';
			}).join('');
		}).join('');
	}

	function add(role, html) {
		$('empty').hidden = true;
		const div = document.createElement('div');
		div.className = 'msg ' + role;
		div.innerHTML = html;
		$('log').append(div);
		$('main').scrollTop = $('main').scrollHeight;
		return div;
	}

	async function loadStatus() {
		const box = $('status');
		const problems = [];
		try {
			const res = await fetch('/api/status');
			const s = await res.json();
			const pills = [];
			pills.push(s.titanos.ok
				? `<span class="pill ok">TitanOS ${escape(s.titanos.version || '')} · ${fill(T.tools, { n: s.titanos.tools.length })}</span>`
				: '<span class="pill bad">TitanOS</span>');
			pills.push(s.ollama.ok ? '<span class="pill ok">Ollama</span>' : '<span class="pill bad">Ollama</span>');
			box.innerHTML = pills.join('');
			if (!s.titanos.ok) problems.push(s.titanos.error);
			if (!s.ollama.ok) problems.push(s.ollama.error);
			const select = $('model');
			const models = s.ollama.ok ? s.ollama.models : [];
			if (!models.includes(s.model)) models.unshift(s.model);
			const chosen = store.get('model');
			select.innerHTML = models.map((m) => `<option>${escape(m)}</option>`).join('');
			select.value = chosen && models.includes(chosen) ? chosen : s.model;
		} catch {
			box.innerHTML = '<span class="pill bad">Agent</span>';
			problems.push(T.down);
		}
		$('problems').innerHTML = problems.map((p) => `<p>${escape(p)}</p>`).join('');
	}

	async function send(text) {
		if (busy || !text.trim()) return;
		busy = true;
		$('send').disabled = true;
		history.push({ role: 'user', content: text });
		add('user', escape(text));
		const answer = add('assistant', `<div class="tools"></div><div class="thinking">${T.thinking}</div>`);
		const tools = answer.querySelector('.tools');
		const thinking = answer.querySelector('.thinking');
		try {
			const res = await fetch('/api/chat', {
				method: 'POST',
				headers: { 'Content-Type': 'application/json' },
				body: JSON.stringify({ model: $('model').value, messages: history })
			});
			if (!res.ok) throw new Error(fill(T.status, { status: res.status }));
			const reader = res.body.getReader();
			const decoder = new TextDecoder();
			let buffer = '';
			let done = false;
			while (!done) {
				const chunk = await reader.read();
				done = chunk.done;
				buffer += decoder.decode(chunk.value || new Uint8Array(), { stream: !done });
				let cut;
				while ((cut = buffer.indexOf('\n\n')) >= 0) {
					const raw = buffer.slice(0, cut);
					buffer = buffer.slice(cut + 2);
					const event = /^event: (.*)$/m.exec(raw)?.[1];
					const data = JSON.parse(/^data: (.*)$/m.exec(raw)?.[1] || '{}');
					if (event === 'tool') {
						const span = document.createElement('span');
						span.className = 'tool' + (data.ok ? '' : ' failed');
						span.textContent = data.name + (data.ok ? '' : ' ✗');
						span.title = JSON.stringify(data.arguments);
						tools.append(span);
						thinking.textContent = fill(T.reading, { tool: data.name });
					} else if (event === 'answer') {
						thinking.remove();
						answer.insertAdjacentHTML('beforeend', markdown(data.text || T.noAnswer));
						history.push({ role: 'assistant', content: data.text || '' });
					} else if (event === 'problem') {
						thinking.remove();
						answer.classList.add('problem');
						answer.insertAdjacentHTML('beforeend', `<p>${escape(data.text)}</p>`);
						history.pop();
						loadStatus();
					}
					$('main').scrollTop = $('main').scrollHeight;
				}
			}
		} catch (err) {
			thinking.remove();
			answer.classList.add('problem');
			answer.insertAdjacentHTML('beforeend', `<p>${escape(err.message || String(err))}</p>`);
			history.pop();
		}
		busy = false;
		$('send').disabled = false;
		$('input').focus();
	}

	$('form').addEventListener('submit', (event) => {
		event.preventDefault();
		const text = $('input').value;
		$('input').value = '';
		$('input').style.height = '';
		send(text);
	});
	$('input').addEventListener('keydown', (event) => {
		if (event.key === 'Enter' && !event.shiftKey && !event.isComposing) {
			event.preventDefault();
			$('form').requestSubmit();
		}
	});
	$('input').addEventListener('input', () => {
		const field = $('input');
		field.style.height = '';
		field.style.height = Math.min(field.scrollHeight, 200) + 'px';
	});
	$('model').addEventListener('change', () => store.set('model', $('model').value));
	$('clear').addEventListener('click', () => {
		history = [];
		$('log').innerHTML = '';
		$('empty').hidden = false;
	});
	$('suggestions').innerHTML = T.suggestions.map((s) => `<button type="button">${escape(s)}</button>`).join('');
	$('suggestions').addEventListener('click', (event) => {
		if (event.target instanceof HTMLButtonElement) send(event.target.textContent);
	});
	loadStatus();
</script>
</body>
</html>
