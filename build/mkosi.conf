# TitanOS system image: a minimal Debian root filesystem.
# mkosi.finalize turns it into filesystem.squashfs, vmlinuz and initrd.img;
# scripts/make-zip.sh puts those on the stick layout.

[Distribution]
Distribution=debian
Release=trixie
Architecture=x86-64
Repositories=main

[Output]
Format=directory
ImageId=titanos
Output=rootfs
OutputDirectory=mkosi.output
ManifestFormat=json

[Build]
CacheDirectory=mkosi.cache
PackageCacheDirectory=mkosi.pkgcache
Incremental=yes

[Content]
# The stick is booted by systemd-boot and live-boot, not by anything mkosi sets up.
Bootable=no
WithDocs=no
Hostname=titanos
Timezone=UTC
Locale=C.UTF-8
Keymap=us

Packages=
        # Base system
        systemd
        systemd-sysv
        systemd-resolved
        systemd-timesyncd
        libpam-systemd
        libnss-myhostname
        login
        passwd
        udev
        dbus
        kmod
        # Kernel and boot into RAM (live-boot: squashfs + overlay)
        linux-image-amd64
        initramfs-tools
        live-boot
        live-boot-initramfs-tools
        systemd-boot-efi
        zstd
        # Stick (FAT32)
        dosfstools
        # Storage: software RAID, filesystems, disk health
        mdadm
        fdisk
        e2fsprogs
        xfsprogs
        smartmontools
        # Shares: SMB, NFS, and being found in the network
        samba
        nfs-kernel-server
        avahi-daemon
        wsdd2
        # Containers
        docker.io
        docker-cli
        docker-compose
        # Virtual machines: KVM/QEMU behind libvirt, UEFI firmware, disk images
        qemu-system-x86
        qemu-utils
        ovmf
        libvirt-daemon-system
        libvirt-clients
        # Folders of the NAS inside a VM, and a TPM for guests that ask for one
        virtiofsd
        swtpm
        swtpm-tools
        # Backups of shares to another volume, server or the cloud
        restic
        # Uninterruptible power supplies (NUT), off unless set up
        nut-server
        nut-client
        # SSH for administrators, off unless switched on in the web UI
        openssh-server
        sudo
        # Network and basic tools
        iproute2
        iputils-ping
        ca-certificates
        procps
        less
        nano
