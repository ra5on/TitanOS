# TitanOS system image: a minimal Debian root filesystem.
# mkosi.finalize turns it into filesystem.squashfs, vmlinuz and initrd.img;
# scripts/make-zip.sh puts those on the stick layout.

[Distribution]
Distribution=debian
Release=trixie
Architecture=x86-64
Repositories=main non-free-firmware

[Output]
Format=directory
ImageId=titanos
Output=rootfs
OutputDirectory=mkosi.output
ManifestFormat=json

[Build]
CacheDirectory=mkosi.cache
PackageCacheDirectory=mkosi.pkgcache
Incremental=yes

[Content]
# The stick is booted by systemd-boot and live-boot, not by anything mkosi sets up.
Bootable=no
WithDocs=no
Hostname=titanos
Timezone=UTC
Locale=C.UTF-8
Keymap=us

Packages=
        # Bounded PDF text extraction for the assistant
        poppler-utils
        tesseract-ocr
        tesseract-ocr-deu
        tesseract-ocr-eng
        # Video thumbnails in the file manager (titand works without it)
        ffmpeg
        # Base system
        systemd
        systemd-sysv
        systemd-resolved
        systemd-timesyncd
        libpam-systemd
        libnss-myhostname
        login
        passwd
        udev
        dbus
        kmod
        # Kernel and boot into RAM (live-boot: squashfs + overlay)
        linux-image-amd64
        initramfs-tools
        live-boot
        live-boot-initramfs-tools
        systemd-boot-efi
        # GRUB images for boards without 64-bit UEFI (BOOTIA32.EFI, BIOS core.img);
        # built in mkosi.postinst.chroot, kept in /usr/share/titanos/boot.
        grub-pc-bin
        grub-efi-ia32-bin
        zstd
        xz-utils
        # Read real bases of inactive/repacked boot slots before plugin cleanup.
        squashfs-tools
        # Portable early microcode: include both vendors regardless of build CPU.
        intel-microcode
        amd64-microcode
        # Selected wired NICs, storage adapters and GPUs; no all-firmware metapackage.
        firmware-linux-free
        firmware-realtek
        firmware-bnx2
        firmware-bnx2x
        firmware-qlogic
        firmware-netxen
        firmware-myricom
        firmware-netronome
        firmware-cavium
        firmware-misc-nonfree
        firmware-intel-graphics
        # Includes intel/vpu: keep Intel NPU firmware even on builders without an NPU.
        firmware-intel-misc
        firmware-amd-graphics
        # Stick (FAT32)
        dosfstools
        # Storage: software RAID, filesystems, disk health
        mdadm
        fdisk
        e2fsprogs
        xfsprogs
        btrfs-progs
        # Optional LUKS2 encryption of volumes (titand, docs/ENCRYPTION.md);
        # only the tool, no crypttab or initramfs integration.
        cryptsetup-bin
        ntfs-3g
        exfatprogs
        smartmontools
        # One-shot standby commands; titand tracks idle time and eligible HDDs.
        hd-idle
        # Shares: SMB, NFS, and being found in the network
        samba
        smbclient
        cifs-utils
        nfs-kernel-server
        avahi-daemon
        wsdd2
        # Containers
        docker.io
        docker-cli
        docker-compose
        # Virtual machines: KVM/QEMU behind libvirt, UEFI/BIOS firmware, disk images
        qemu-system-x86
        qemu-utils
        ovmf
        seabios
        libvirt-daemon-system
        libvirt-clients
        # Folders of the NAS inside a VM, and a TPM for guests that ask for one
        virtiofsd
        swtpm
        swtpm-tools
        # System containers (LXC). The download template needs wget, tar and xz;
        # no lxc-net and no distribution templates: containers join the bridges
        # of the NAS and are made from images.linuxcontainers.org.
        lxc
        wget
        # Backups of shares to another volume, server or the cloud
        restic
        # Uninterruptible power supplies (NUT), off unless set up
        nut-server
        nut-client
        # SSH for administrators, off unless switched on in the web UI
        openssh-server
        sudo
        # Network and basic tools
        iproute2
        # wg for the optional WireGuard tunnel to an IPv64 Cloud Router
        # (the kernel module is part of the Debian kernel)
        wireguard-tools
        iputils-ping
        iptables
        # titand loads its own table inet titanos when the firewall is on
        nftables
        ca-certificates
        pci.ids
        procps
        less
        nano
