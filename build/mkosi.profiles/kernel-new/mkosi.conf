# Kernel choice "Neu" (docs/KERNEL.md): the same system with the newer kernel
# from trixie-backports, and the firmware packages from there where they are
# newer. Built next to the default image (scripts/make-zip.sh --kernel-new)
# into mkosi.output-new; releases carry it as the slot variant "new".

[Build]
# apt in the build reads sandbox/etc/apt: trixie-backports as a source and a
# pin that takes kernel and firmware from it.
SandboxTrees=sandbox
