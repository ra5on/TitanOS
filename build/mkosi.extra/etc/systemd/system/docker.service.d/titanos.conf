# Before a restart or shutdown titand stops the engine and gives every
# container a minute to end ("shutdown-timeout" in daemon.json). The
# default of systemd (90 s) would cut that short.
[Service]
TimeoutStopSec=150
# docker.service waits forever by default (TimeoutStartSec=0); a dockerd
# hanging on a slow or broken data volume would block titand for good.
TimeoutStartSec=5min
