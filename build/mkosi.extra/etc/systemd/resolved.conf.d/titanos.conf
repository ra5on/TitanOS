# The stub listener on 127.0.0.53:53 would keep port 53 from apps that are
# DNS servers themselves (AdGuard Home, Pi-hole): Docker cannot publish a
# port another socket of the NAS holds. systemd-resolved keeps looking
# after the DNS servers of the network; programs read them directly from
# /etc/resolv.conf (see tmpfiles.d/titanos-resolv.conf). PLAN 76, F-14-2.
[Resolve]
DNSStubListener=no
