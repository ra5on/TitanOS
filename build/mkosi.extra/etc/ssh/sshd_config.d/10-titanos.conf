# TitanOS: SSH access for owners and administrators.
#
# The service is off unless it is switched on in the web UI. Logging in
# takes a key that is stored with the account there; passwords are not
# accepted and root cannot log in. titand writes the keys and puts the
# accounts that may log in into the group titanos-ssh.
HostKey /etc/ssh/ssh_host_ed25519_key
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
PubkeyAuthentication yes
# Owned by root, so an account cannot add keys behind TitanOS's back.
AuthorizedKeysFile /etc/ssh/authorized_keys/%u
AllowGroups titanos-ssh
X11Forwarding no
